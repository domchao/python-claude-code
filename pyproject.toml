[project]
name = "python-claude-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "domchao", email = "d.chaopradith@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "pydantic>=2.13.5",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
python-claude-code = "python_claude_code:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
